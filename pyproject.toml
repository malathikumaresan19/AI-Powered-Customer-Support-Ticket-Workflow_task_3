[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-ticket-workflow"
version = "0.1.0"
description = "Convert unresolved conversations into routed, SLA-aware support tickets"
requires-python = ">=3.11"

[project.scripts]
support-workflow = "support_workflow.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
